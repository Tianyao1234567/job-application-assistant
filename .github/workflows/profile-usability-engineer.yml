name: Profile usability engineer checks

on:
  push:
    branches: [engineer/profile-import-usability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-usability-engineer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-checks:
    if: github.ref == 'refs/heads/engineer/profile-import-usability'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --init --ipc=host
      volumes:
        - ${{ github.workspace }}:/workspace
    defaults:
      run:
        shell: bash
        working-directory: /workspace
    env:
      TEMP: /workspace/.runtime/tmp
      TMP: /workspace/.runtime/tmp
      TMPDIR: /workspace/.runtime/tmp
      npm_config_cache: /workspace/.runtime/cache
      PLAYWRIGHT_BROWSERS_PATH: /workspace/.runtime/browsers
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CLOUD_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      GREENHOUSE_BROWSER_MODE: page-driver
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated paths
        run: |
          test /workspace -ef "$GITHUB_WORKSPACE"
          mkdir -p .runtime/tmp .runtime/cache .runtime/browsers .runtime/tests/evidence
          git config --global --add safe.directory /workspace
          git -C /workspace rev-parse --verify HEAD
      - name: Install locked test dependencies
        working-directory: /workspace/autofill-extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked runtime dependencies
        working-directory: /workspace/runtime-deps
        run: npm ci --include=optional --ignore-scripts --no-audit --no-fund
      - name: Check source and focused regressions
        run: |
          node scripts/cloud-check.mjs
          node autofill-extension/tests/unit.test.js
          if node --test --test-reporter=tap --test-concurrency=1 local-app/tests/profile-answers.test.mjs local-app/tests/greenhouse-adapter.test.mjs local-app/tests/greenhouse-runner.test.mjs local-app/tests/profile-education-status.test.mjs local-app/tests/profile-english-retirement.test.mjs local-app/tests/profile-rework-fields.test.mjs local-app/tests/profile-skill-categories.test.mjs local-app/tests/profile-saved-education-repair.test.mjs local-app/tests/profile-saved-skills-repair.test.mjs local-app/tests/profile-update.test.mjs local-app/tests/profile-update-target-memory.test.mjs local-app/tests/profile-file-import.test.mjs local-app/tests/profile-update-package.test.mjs local-app/tests/update-install.test.mjs > .runtime/focused.log 2>&1; then
            cat .runtime/focused.log
          else
            cat .runtime/focused.log
            python3 -c 'from pathlib import Path; s=Path(".runtime/focused.log").read_text(); sections=s.split("not ok "); details="\n".join("not ok "+p[:1100] for p in sections[1:]); print("::error title=Focused regression failures::"+(details or s[-3000:])[:12000].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Verify and copy bundled Chromium
        if: ${{ !cancelled() }}
        run: node scripts/cloud-check.mjs container-browser
      - name: Exercise fictional dashboard and answer workflows
        run: |
          set +e
          xvfb-run --auto-servernum node local-app/tests/greenhouse-answer-ui-browser.mjs > .runtime/answer-browser.log 2>&1
          answer_status=$?
          xvfb-run --auto-servernum node local-app/tests/profile-usability-ui-browser.mjs > .runtime/profile-browser.log 2>&1
          profile_status=$?
          cat .runtime/answer-browser.log .runtime/profile-browser.log
          if (( answer_status != 0 || profile_status != 0 )); then
            python3 -c 'from pathlib import Path; a=Path(".runtime/answer-browser.log").read_text()[-4000:]; b=Path(".runtime/profile-browser.log").read_text()[-4000:]; print("::error title=Fictional browser failures::"+("Answer workflow:\n"+a+"\nProfile workflow:\n"+b).replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Probe actual MV3 answer workflow
        env:
          GREENHOUSE_BROWSER_MODE: extension
        run: |
          if xvfb-run --auto-servernum node local-app/tests/greenhouse-answer-ui-browser.mjs > .runtime/mv3-answer.log 2>&1; then
            cat .runtime/mv3-answer.log
          else
            cat .runtime/mv3-answer.log
            python3 -c 'from pathlib import Path; s=Path(".runtime/mv3-answer.log").read_text()[-5000:]; print("::error title=MV3 answer workflow::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Probe MV3 pre-send attachment verification
        if: ${{ !cancelled() }}
        run: |
          if xvfb-run --auto-servernum node local-app/tests/greenhouse-cdp-guard-browser.mjs > .runtime/mv3-guard.log 2>&1; then
            cat .runtime/mv3-guard.log
          else
            cat .runtime/mv3-guard.log
            python3 -c 'from pathlib import Path; s=Path(".runtime/mv3-guard.log").read_text()[-5000:]; print("::error title=MV3 pre-send experiment::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Probe MV3 default network block
        if: ${{ !cancelled() }}
        run: |
          if xvfb-run --auto-servernum node local-app/tests/greenhouse-dnr-guard-browser.mjs > .runtime/mv3-dnr-guard.log 2>&1; then
            cat .runtime/mv3-dnr-guard.log
          else
            cat .runtime/mv3-dnr-guard.log
            python3 -c 'from pathlib import Path; s=Path(".runtime/mv3-dnr-guard.log").read_text()[-5000:]; print("::error title=MV3 default block experiment::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Probe MV3 URL marker default block
        if: ${{ !cancelled() }}
        run: |
          if xvfb-run --auto-servernum node local-app/tests/greenhouse-dnr-url-guard-browser.mjs > .runtime/mv3-url-guard.log 2>&1; then
            cat .runtime/mv3-url-guard.log
          else
            cat .runtime/mv3-url-guard.log
            python3 -c 'from pathlib import Path; s=Path(".runtime/mv3-url-guard.log").read_text()[-5000:]; print("::error title=MV3 URL marker experiment::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Preserve fictional answer workflow result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fictional-answer-workflow-result
          path: |
            /workspace/.runtime/tests/evidence/greenhouse-answer-ui-browser.json
            /workspace/.runtime/tests/evidence/greenhouse-answer-mv3-browser.json
            /workspace/.runtime/tests/evidence/greenhouse-cdp-guard.json
            /workspace/.runtime/tests/evidence/greenhouse-dnr-guard.json
            /workspace/.runtime/tests/evidence/greenhouse-dnr-url-guard.json
            /workspace/.runtime/tests/evidence/profile-usability-ui-browser.json
          if-no-files-found: warn
          retention-days: 7

  windows-update:
    if: ${{ contains(github.event.head_commit.message, '[windows-check]') }}
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      JOB_ASSISTANT_NONINTERACTIVE: '1'
      JOB_ASSISTANT_BROWSER_TEST: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test fictional candidate.8 and candidate.10 updates
        run: node scripts/test-windows-update.mjs
      - name: Preserve bounded test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fictional-windows-update-check
          path: |
            .runtime/delivery/update-*/更新.cmd
            .runtime/delivery/update-*/UPDATE.json
            .runtime/tests/evidence/windows-update.json
          if-no-files-found: warn
          retention-days: 7
